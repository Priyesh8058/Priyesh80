<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Medicare Hospital</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f8ff;
        }
        .header {
            background: #0077b6;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
        }
        .back-btn {
            background: white;
            color: #0077b6;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }
        .title {
            text-align: center;
            color: #0077b6;
        }
        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
            margin-top: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 7px;
            font-weight: bold;
        }
        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .buttons {
            text-align: center;
            margin-top: 25px;
        }
        button {
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .save-btn {
            background: #0077b6;
            color: white;
        }
        .clear-btn {
            background: #777;
            color: white;
            margin-left: 10px;
        }
        .table-box {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0077b6;
            color: white;
            padding: 12px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        .delete-btn {
            background: #e63946;
            color: white;
            padding: 7px 12px;
        }
        @media(max-width:700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h2>🏥 Medicare Hospital</h2>
    <a href="admin.html" class="back-btn">
        Back to Admin
    </a>
</header>
<div class="container">
    <h1 class="title">Staff Management</h1>
    <div class="form-box">
        <form id="staffForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Staff ID</label>
                    <input type="text" id="staffId"
                           placeholder="Enter Staff ID">
                </div>
                <div class="form-group">
                    <label>Staff Name</label>
                    <input type="text" id="staffName"
                           placeholder="Enter Staff Name" required>
                </div>
                <div class="form-group">
                    <label>Staff Role</label>
                    <select id="staffRole" required>
                        <option value="">Select Role</option>
                        <option>Nurse</option>
                        <option>Receptionist</option>
                        <option>Lab Technician</option>
                        <option>Pharmacist</option>
                        <option>Accountant</option>
                        <option>Ward Staff</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="staffPhone"
                           placeholder="Enter Phone Number"
                           maxlength="10" required>
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="save-btn">
                    Save Staff
                </button>
                <button type="button" class="clear-btn"
                        onclick="clearForm()">
                    Clear
                </button>
            </div>
        </form>
    </div>
    <div class="table-box">
        <h2>Staff Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Staff ID</th>
                    <th>Staff Name</th>
                    <th>Role</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="staffTable"></tbody>
        </table>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
