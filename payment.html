<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management - Medicare Hospital</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f8ff;
        }
        .header {
            background: #0077b6;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
        }
        .back-btn {
            background: white;
            color: #0077b6;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }
        .title {
            text-align: center;
            color: #0077b6;
        }
        .payment-box,
        .records-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
            margin-top: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 7px;
            font-weight: bold;
        }
        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .amount-box {
            margin-top: 25px;
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .amount-box h2 {
            color: #0077b6;
            margin: 0;
        }
        .buttons {
            text-align: center;
            margin-top: 25px;
        }
        button {
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            color: white;
            margin: 5px;
        }
        .pay-btn {
            background: #0077b6;
        }
        .clear-btn {
            background: #777;
        }
        .records-box {
            overflow-x: auto;
        }
        .records-box h2 {
            color: #0077b6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0077b6;
            color: white;
            padding: 12px;
        }
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        @media(max-width:700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h2>🏥 Medicare Hospital</h2>
    <a href="admin.html" class="back-btn">
        Back to Admin
    </a>
</header>
<div class="container">
    <h1 class="title">Payment Management</h1>
    <div class="payment-box">
        <form id="paymentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Payment ID</label>
                    <input type="text" id="paymentId"
                           placeholder="Enter Payment ID">
                </div>
                <div class="form-group">
                    <label>Bill ID</label>
                    <input type="text" id="paymentBillId"
                           placeholder="Enter Bill ID" required>
                </div>
                <div class="form-group">
                    <label>Patient ID</label>
                    <input type="text" id="paymentPatientId"
                           placeholder="Enter Patient ID" required>
                </div>
                <div class="form-group">
                    <label>Payment Amount</label>
                    <input type="number" id="paymentAmount"
                           placeholder="Enter Amount"
                           min="0" required>
                </div>
                <div class="form-group">
                    <label>Payment Date</label>
                    <input type="date" id="paymentDate" required>
                </div>
                <div class="form-group">
                    <label>Payment Status</label>
                    <select id="paymentStatus" required>
                        <option value="">Select Status</option>
                        <option>Paid</option>
                        <option>Pending</option>
                    </select>
                </div>
            </div>
            <div class="amount-box">
                <h2 id="totalAmount">Payment Amount: ₹0</h2>
            </div>
            <div class="buttons">
                <button type="submit" class="pay-btn">
                    Save Payment
                </button>
                <button type="button" class="clear-btn"
                        onclick="clearForm()">
                    Clear
                </button>
            </div>
        </form>
    </div>
    <div class="records-box">
        <h2>Payment Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Bill ID</th>
                    <th>Patient ID</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="paymentTable"></tbody>
        </table>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
